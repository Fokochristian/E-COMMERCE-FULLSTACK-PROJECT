<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Orders | E-Commerce Store</title>

    <link
        rel="stylesheet"
        href="css/orders.css"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"
    ></script>

</head>

<body>

    <header>

        <nav aria-label="Main navigation">

            <a
                href="index.html"
                aria-label="Go to Store Page"
            >
                Store
            </a>

            <div id="mobile-menu">

                <form id="product-search">

                    <label for="search">
                        Search products
                    </label>

                    <input
                        type="search"
                        id="search"
                        name="search"
                        placeholder="Search products..."
                    >

                    <button type="submit">
                        Search
                    </button>

                </form>

                <div id="auth-navigation"></div>

            </div>

            <div id="header-actions">

                <a
                    href="cart.html"
                    id="cart-link"
                    aria-label="Shopping cart"
                >
                    Cart
                </a>

                <button
                    id="menu-toggle"
                    type="button"
                    aria-label="Open menu"
                    aria-expanded="false"
                    aria-controls="mobile-menu"
                >
                    ☰
                </button>

            </div>

        </nav>

    </header>


    <main>

        <section aria-labelledby="orders-heading">

            <h1 id="orders-heading">
                My Orders
            </h1>

            <div id="orders-list"></div>

            <p
                id="orders-message"
                role="alert"
            ></p>

        </section>

    </main>


    <footer>

        <p>
            &copy; 2026 E-Commerce Store
        </p>

    </footer>


    <script
        type="module"
        src="js/orders.js"
    ></script>

</body>

</html>
