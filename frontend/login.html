<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Orxeva</title>
    <meta name="robots" content="noindex, nofollow">

    <link rel="stylesheet" href="css/login.css">

    <link rel="icon" type="image/png" href="assets/Orxeva.png">

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body>

    <header>
        <nav aria-label="Main navigation">

            <a
                href="index.html"
                aria-label="Go to Store Page"
            >
                Store
            </a>

        </nav>
    </header>

    <main>

        <section aria-labelledby="login-heading">

            <h1 id="login-heading">
                Login
            </h1>

            <form
                id="login-form"
                method="post"
                novalidate
            >

                <div>

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                    >

                    <p
                        id="email-error"
                        role="alert"
                    ></p>

                </div>

                <div>

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        required
                    >

                    <p
                        id="password-error"
                        role="alert"
                    ></p>

                </div>

                <button type="submit">
                    Login
                </button>

            </form>

            <p class="account-link">
                Don't have an account yet?
                <a href="register.html">
                    Sign up
                </a>
            </p>

            <p
                id="login-message"
                role="alert"
            ></p>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Orxeva. All rights reserved.</p>
    </footer>

    <script
        type="module"
        src="js/login.js"
    ></script>

</body>
</html>
