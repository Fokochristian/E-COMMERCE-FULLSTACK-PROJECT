<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | E-Commerce Store</title>

    <link rel="stylesheet" href="css/register.css">

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body>

    <header>
        <nav aria-label="Main navigation">

            <a
                href="index.html"
                aria-label="Go to Store Page"
            >
                Store
            </a>

            <a href="login.html">
                Login
            </a>

        </nav>
    </header>

    <main>

        <section aria-labelledby="register-heading">

            <h1 id="register-heading">
                Create an account
            </h1>

            <form
                id="register-form"
                method="post"
                novalidate
            >

                <div>
                    <label for="first-name">
                        First name
                    </label>

                    <input
                        type="text"
                        id="first-name"
                        name="first-name"
                        autocomplete="given-name"
                        required
                    >

                    <p
                        id="first-name-error"
                        role="alert"
                    ></p>
                </div>

                <div>
                    <label for="last-name">
                        Last name
                    </label>

                    <input
                        type="text"
                        id="last-name"
                        name="last-name"
                        autocomplete="family-name"
                        required
                    >

                    <p
                        id="last-name-error"
                        role="alert"
                    ></p>
                </div>

                <div>
                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                    >

                    <p
                        id="email-error"
                        role="alert"
                    ></p>
                </div>

                <div>
                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="new-password"
                        required
                    >

                    <p
                        id="password-error"
                        role="alert"
                    ></p>
                </div>

                <div>
                    <label for="confirm-password">
                        Confirm password
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        autocomplete="new-password"
                        required
                    >

                    <p
                        id="confirm-password-error"
                        role="alert"
                    ></p>
                </div>

                <button type="submit">
                    Create Account
                </button>

            </form>

            
            <p class="account-link">
                Already have an account?
                <a href="login.html">
                    Login
                </a>
            </p>
            
            <p
                id="register-message"
                role="alert"
            ></p>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 E-Commerce Store</p>
    </footer>

    <script
        type="module"
        src="js/register.js"
    ></script>

</body>
</html>
