<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cart | E-Commerce Store</title>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <link rel="stylesheet" href="css/cart.css">
</head>

<body>

    <header>
        <nav aria-label="Main navigation">

            <a
                href="index.html"
                aria-label="Go to Store Page"
            >
                Store
            </a>

            <div id="mobile-menu">

                <form id="product-search">

                    <label for="search">
                        Search products
                    </label>

                    <input
                        type="search"
                        id="search"
                        name="search"
                        placeholder="Search products..."
                    >

                    <button type="submit">
                        Search
                    </button>

                </form>

                <div id="auth-navigation"></div>

            </div>

            <div id="header-actions">

                <a
                    href="cart.html"
                    id="cart-link"
                    aria-label="Shopping cart"
                >
                    Cart
                </a>

                <button
                    id="menu-toggle"
                    type="button"
                    aria-label="Open menu"
                    aria-expanded="false"
                    aria-controls="mobile-menu"
                >
                    ☰
                </button>

            </div>

        </nav>
    </header>

    <main>

        <section aria-labelledby="cart-heading">

            <h1 id="cart-heading">
                Your Cart
            </h1>

            <div id="cart-items">

            </div>

            <p id="cart-total"></p>

            <a
                href="checkout.html"
                id="checkout-link"
            >
                Proceed to checkout
            </a>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 E-Commerce Store</p>
    </footer>

    <script type="module" src="js/cart.js"></script>

</body>
</html>
